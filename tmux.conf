# Requires tmux >= 3.2

# A status line theme generated by tmuxline.vim
if-shell "test -f ~/.tmuxline" "source ~/.tmuxline"

# ---------------------------------------------------------------------------
# Terminal capabilities
# ---------------------------------------------------------------------------
set -g  default-terminal "tmux-256color"
# True color + extended keys (Shift+Enter etc.) for the outer terminal
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm*:extkeys"
set -s  extended-keys on
# Let applications pass escape sequences (notifications, images) through tmux
set -g  allow-passthrough on
set -g  focus-events on

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------
# Setting the delay between prefix and command.
set -sg escape-time 1
set -g  history-limit 50000
set -g  display-time 2000
set -g  set-titles on
set-option -g mouse on

# Enable vi keys.
setw -g mode-keys vi
set -g  status-keys vi

# Windows and panes start at 1 and are renumbered when one is closed.
set -g  base-index 1
setw -g pane-base-index 1
set -g  renumber-windows on

# Enable activity alerts.
setw -g monitor-activity on
set -g visual-activity on

# ---------------------------------------------------------------------------
# Prefix
# ---------------------------------------------------------------------------
# remap prefix to Control + n
unbind C-b
set -g prefix C-n
# bind 'C-n C-n' to type 'C-n'
bind C-n send-prefix

# reload config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# ---------------------------------------------------------------------------
# Windows, panes, layouts
# ---------------------------------------------------------------------------
# New panes / windows start in the current pane's directory.
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"

# Moving between panes.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt+hjkl switch pane (no prefix; needs Option key = Esc+ in iTerm2)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Re-bind last window command
bind b last-window

# Pane resizing.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Layouts
bind m select-layout main-vertical
bind t select-layout tiled
bind f select-layout even-horizontal

# Smart pane switching with awareness of vim splits
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim='echo "#{pane_current_command}" | grep -iqE "(^|\/)g?(view|n?vim?x?)(diff)?$"'
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -n 'C-\' if-shell "$is_vim" "send-keys 'C-\\'" "select-pane -l"

# ---------------------------------------------------------------------------
# Vimlike copy mode
# ---------------------------------------------------------------------------
# Copies go to the system clipboard via OSC 52, plus pbcopy on macOS.
set -g set-clipboard on
if-shell "uname | grep -q Darwin" "set -s copy-command 'pbcopy'"

unbind p
bind p paste-buffer
bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi C-v    send -X rectangle-toggle
bind -T copy-mode-vi y      send -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter  send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H      send -X start-of-line
bind -T copy-mode-vi L      send -X end-of-line

# ---------------------------------------------------------------------------
# Colors
# ---------------------------------------------------------------------------
# Pane colors.
set -g pane-border-style "fg=green"

# Command / message line.
set -g message-style "fg=white,bg=black,bright"

# ---------------------------------------------------------------------------
# Plugins (optional; install tpm first, see README)
# ---------------------------------------------------------------------------
# set -g @plugin 'seebi/tmux-colors-solarized'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
if-shell "test -x ~/.tmux/plugins/tpm/tpm" "run '~/.tmux/plugins/tpm/tpm'"
