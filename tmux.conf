# Requires tmux >= 3.2

# A status line theme generated by tmuxline.vim
if-shell "test -f ~/.tmuxline" "source ~/.tmuxline"

# ---------------------------------------------------------------------------
# Terminal capabilities
# ---------------------------------------------------------------------------
set -g  default-terminal "tmux-256color"
# True color + extended keys (Shift+Enter etc.) for the outer terminal
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm*:extkeys"
# Same when the outer terminal is another tmux (ssh from a local tmux into a
# remote tmux), so the inner tmux forwards copies (OSC 52) and true color to
# the outer one. tmux 3.8 does this by itself; this covers older remotes.
set -as terminal-features ",tmux*:clipboard:RGB:extkeys"
set -s  extended-keys on
# Let applications pass escape sequences (notifications, images) through tmux
set -g  allow-passthrough on
set -g  focus-events on

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------
# Setting the delay between prefix and command.
set -sg escape-time 1
set -g  history-limit 50000
set -g  display-time 2000
set -g  set-titles on
set-option -g mouse on

# Enable vi keys.
setw -g mode-keys vi
set -g  status-keys vi

# Windows and panes start at 1 and are renumbered when one is closed.
set -g  base-index 1
setw -g pane-base-index 1
set -g  renumber-windows on

# ---------------------------------------------------------------------------
# Prefix
# ---------------------------------------------------------------------------
# remap prefix to Control + a
unbind C-b
set -g prefix C-a
# press 'C-a C-a' to send a literal 'C-a' (e.g. start of line in the shell)
bind C-a send-prefix

# reload config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# ---------------------------------------------------------------------------
# Windows, panes, layouts
# ---------------------------------------------------------------------------
# New panes / windows start in the current pane's directory.
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"

# Moving between panes.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt+hjkl switch pane (no prefix; needs Option key = Esc+ in iTerm2)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Re-bind last window command
bind b last-window

# Pane resizing.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Layouts
bind m select-layout main-vertical
bind t select-layout tiled
bind f select-layout even-horizontal

# ---------------------------------------------------------------------------
# Vimlike copy mode
# ---------------------------------------------------------------------------
# Copies go to the system clipboard via OSC 52, plus pbcopy on macOS.
# OSC 52 is what makes copying work over ssh: the remote tmux sends the text
# through the terminal to the local clipboard, no X11 / pbcopy needed there.
# "on" (not "external") also lets a nested tmux or vim on the remote do it.
set -g set-clipboard on
if-shell "uname | grep -q Darwin" "set -s copy-command 'pbcopy'"

# prefix P / prefix ] paste the tmux buffer (prefix p stays previous-window).
# -p uses bracketed paste, so a multi-line paste is not executed line by line.
bind P   paste-buffer -p
bind ]   paste-buffer -p
bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi C-v    send -X rectangle-toggle
bind -T copy-mode-vi y      send -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter  send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H      send -X start-of-line
bind -T copy-mode-vi L      send -X end-of-line

# ---------------------------------------------------------------------------
# ssh / nested tmux
# ---------------------------------------------------------------------------
# A tmux started inside an ssh session puts its status line at the top, so a
# remote tmux running inside a local one shows two distinct bars.
if-shell '[ -n "$SSH_CONNECTION" ]' "set -g status-position top"

# F12 hands the keyboard to the inner (remote) tmux: the outer prefix and
# Alt+hjkl are switched off until F12 is pressed again. Without it, the inner
# tmux is still reachable by pressing the prefix twice (C-a C-a <key>).
bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  if -F "#{pane_in_mode}" "send-keys -X cancel" \;\
  refresh-client -S
bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  refresh-client -S
set -ga status-left "#{?#{==:#{client_key_table},off},#[fg=colour231#,bg=colour160#,bold] OUTER KEYS OFF (F12) #[default],}"

# ---------------------------------------------------------------------------
# Colors
# ---------------------------------------------------------------------------
# Pane borders: dim for inactive, bright cyan for the active pane.
# (message / status colors come from tmuxline)
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour51"

# ---------------------------------------------------------------------------
# Plugins (optional; install tpm first, see README)
# ---------------------------------------------------------------------------
# set -g @plugin 'seebi/tmux-colors-solarized'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
if-shell "test -x ~/.tmux/plugins/tpm/tpm" "run '~/.tmux/plugins/tpm/tpm'"
